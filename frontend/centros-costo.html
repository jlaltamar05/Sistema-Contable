<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centros de Costo — Sistema Administrativo</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body class="pantalla-ancha" data-modulo="centros-costo">
  <div class="app-shell">
    <nav class="barra-lateral" id="barra-lateral"></nav>

    <main class="contenido">
      <div class="encabezado-pagina">
        <div>
          <h1>Centros de Costo</h1>
          <p>Maestro de centros de costo de esta compañía.</p>
        </div>
      </div>

      <div id="caja-mensaje" class="mensaje"></div>

      <section class="panel">
        <h2 id="titulo-formulario">Nuevo centro de costo</h2>
        <form id="formulario-cc">
          <div class="formulario-grid">
            <div class="campo">
              <label for="cc-codigo">Código *</label>
              <input type="text" id="cc-codigo" autocomplete="off" required />
            </div>
            <div class="campo campo-ancho">
              <label for="cc-nombre">Nombre *</label>
              <input type="text" id="cc-nombre" autocomplete="off" required />
            </div>
            <div class="campo" id="campo-activo" style="display:none;">
              <label style="display:flex; align-items:center; gap:6px;">
                <input type="checkbox" id="cc-activo" checked style="width:auto;" /> Activo
              </label>
            </div>
          </div>
          <div class="acciones-formulario">
            <button type="submit" class="boton boton-primario" id="boton-guardar-cc">Guardar</button>
            <button type="button" class="boton boton-secundario" id="boton-cancelar-cc" style="display:none;">Cancelar edición</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2>Centros de costo registrados</h2>
        <table>
          <thead><tr><th>Código</th><th>Nombre</th><th>Estado</th><th></th></tr></thead>
          <tbody id="tabla-cc"></tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/navegacion.js"></script>
  <script src="js/centros-costo.js"></script>
</body>
</html>
