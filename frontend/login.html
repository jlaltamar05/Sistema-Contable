<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · Sistema Contable</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body style="background: var(--azul-noche); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
  <div style="background: var(--papel-panel); border-radius: var(--radio); padding: 32px; width: 100%; max-width: 380px; box-shadow: var(--sombra);">
    <h1 style="margin-top: 0;">Sistema Contable</h1>
    <p style="color: var(--texto-suave); margin-top: -8px;">Sistema aparte del Administrativo — usa el mismo usuario y contraseña.</p>

    <div id="caja-mensaje" class="mensaje"></div>

    <form id="form-login">
      <div class="campo">
        <label for="login-email">Correo electrónico</label>
        <input type="email" id="login-email" required autofocus />
      </div>
      <div class="campo" style="margin-top: 12px;">
        <label for="login-password">Contraseña</label>
        <div style="display:flex; gap:6px;">
          <input type="password" id="login-password" required style="flex:1;" />
          <button type="button" id="boton-ver-login-password" title="Mostrar/ocultar" style="flex-shrink:0; background:none; border:1px solid var(--linea); border-radius:6px; cursor:pointer;">👁</button>
        </div>
      </div>
      <button type="submit" class="boton boton-primario" style="width: 100%; margin-top: 18px;">Iniciar sesión</button>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
